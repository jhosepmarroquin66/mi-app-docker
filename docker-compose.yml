version: "3.9"

services:

  backend:
    build:
      context: ./backend/BackEndApi/BackEndApi
      dockerfile: Dockerfile
    ports:
      - "5000:8080"
    environment:
    - ASPNETCORE_ENVIRONMENT=Development 

  frontend:
    build:
      context: ./frontend/mi-app
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - backend